<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mining Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="student">
<main class="wrap">
  <header class="top"><div class="brand">⛏ Mining Simulator</div><div id="who" class="who"></div></header>

  <div id="banner" class="banner hidden"></div>

  <section id="join" class="card hidden">
    <h1>Join the mining race</h1>
    <p style="margin:0 0 12px;color:#6c757d">Pick a nickname. Your teacher will see it on the big screen.</p>
    <form id="joinForm">
      <input id="nick" maxlength="20" autocomplete="off" placeholder="Nickname" aria-label="Nickname" required>
      <button class="btn block" type="submit">Start mining</button>
    </form>
  </section>

  <section id="play" class="hidden">
    <div id="status" class="status"></div>
    <div id="practiceBar" class="tabs hidden"></div>

    <div id="rule" class="card rule hidden"></div>

    <div id="sideBox" class="card hidden">
      <h2>Round 2: which side are you on?</h2>
      <div class="seg">
        <button type="button" class="btn ghost" data-side="odd">Odd nonces</button>
        <button type="button" class="btn ghost" data-side="even">Even nonces</button>
      </div>
    </div>

    <form id="tryForm" class="card" autocomplete="off" novalidate>
      <label for="nonce">Try a nonce</label>
      <div class="row">
        <input id="nonce" inputmode="numeric" pattern="[0-9]*" maxlength="7" placeholder="e.g. 7" aria-label="Nonce">
        <button class="btn" id="tryBtn" type="submit">Compute hash</button>
      </div>
      <div id="result" aria-live="polite"></div>
      <button type="button" id="submitBtn" class="btn gold block hidden"></button>
      <div id="note" class="note"></div>
    </form>

    <div class="card" id="triesCard">
      <h2>Your tries <span id="count" style="color:#6c757d;font-weight:400"></span></h2>
      <div id="tries" class="chips"></div>
    </div>
  </section>
</main>
<script type="module" src="student.js"></script>
</body>
</html>
