<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mining Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="student">
<main class="wrap">
  <header class="top"><div class="brand">⛏ Mining Simulator</div><div id="who" class="who"></div></header>

  <div id="banner" class="banner hidden"></div>

  <section id="join" class="card hidden">
    <h1>Join the mining race</h1>
    <p style="margin:0 0 12px;color:#6c757d">Pick a nickname. Your teacher will see it on the big screen. Only the first miner to find a valid nonce earns the Bitcoin reward.</p>
    <form id="joinForm">
      <input id="nick" maxlength="20" autocomplete="off" placeholder="Nickname" aria-label="Nickname" required>
      <button class="btn block" type="submit">Start mining</button>
    </form>
  </section>

  <section id="play" class="hidden">
    <div id="status" class="status"></div>
    <div id="practiceBar" class="tabs hidden"></div>
    <div id="lobbyMsg" class="card hidden" style="text-align:center;color:#6c757d">Keep this page open. The teacher will start the first round soon.</div>

    <div id="winnerBox" class="winner hidden"></div>
    <div id="taskBox" class="task hidden"></div>
    <div id="blockMount"></div>
    <div id="result" aria-live="polite"></div>

    <div id="sideBox" class="card hidden">
      <h2>Round 2: which side are you on?</h2>
      <div class="seg">
        <button type="button" class="btn ghost" data-side="odd">Odd nonces</button>
        <button type="button" class="btn ghost" data-side="even">Even nonces</button>
      </div>
    </div>

    <button type="button" id="submitBtn" class="btn gold block hidden"></button>
    <div id="note" class="note"></div>

    <div class="card" id="triesCard">
      <h2>Your tries <span id="count" style="color:#6c757d;font-weight:400"></span></h2>
      <div id="tries" class="chips"></div>
    </div>
  </section>
</main>
<script>
function scriptFailed(){var b=document.getElementById('banner');b.className='banner';b.innerHTML='The page scripts failed to load, so nothing can run. Open <a href="debug.html"><b>debug.html</b></a> to see exactly what is wrong.';}
setTimeout(function(){var j=document.getElementById('join'),p=document.getElementById('play');if(j.classList.contains('hidden')&&p.classList.contains('hidden'))scriptFailed();},3000);
</script>
<script type="module" src="student.js" onerror="scriptFailed()"></script>
</body>
</html>
